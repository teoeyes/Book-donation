<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1>Book Donation Form</h1>
  <p>Fill out this form</p>
  <form>
    <fieldset>
        <legend>Enter personal details</legend>
        
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        
        <label for="ID Number">ID Number:</label>
        <input type="text" id="ID Number" name="ID Number"><br><br>
        
        
        
        
    </fieldset>
    <br>
      <fieldset>
        <legend>Book genre</legend>
         <label>Choose your book genre</label>
         <select>
          <option>"select a genre"</option>
          <option>"Fiction"</option>
          <option>"Non-Fiction"</option>
          </select>
          
         

      </br>

      <label>Why are you donating books?</label>
      <input type="radio" name="reason" value="charity">Charity<br>
      <input type="radio" name="reason" value="supporting library">Supporting Library<br>
      <input type="radio" name="reason" value="Stopped reading.">Stopped reading.<br>

      <label>Any damage to the books?</label>
      <textarea id="notes" rows="3" cols="36" placeholder="eg. Pages are torn."></textarea>

      



    </fieldset>
    </br>




    <fieldset>
        <legend>Check in day</legend>
        <input type="checkbox" value="Monday">monday<br>
        <input type="checkbox" value="Tuesday">Tuesday<br>
        <input type="checkbox" value="Wednesday">Wednesday<br>
        <input type="checkbox" value="Thursday">Thursday<br>
        <input type="checkbox" value="Friday">Friday<br>




    </fieldset>


    <input type="submit" value ="Complete Form">
    <form>
</body>
</html>
